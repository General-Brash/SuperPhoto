<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperPhoto 分享结果</title><link rel="stylesheet" href="/assets/styles.css?v=20260829-2"></head><body class="share-body"><main class="share-card"><a class="brand share-brand" href="/"><span class="brand-mark">S</span><span>SuperPhoto</span></a><p class="eyebrow">公开分享</p><h1 id="shareTitle">正在载入结果</h1><p id="shareMeta">此链接仅包含增强后的图片。</p><div class="share-image"><img id="shareImage" alt="SuperPhoto 增强结果"></div><a id="shareDownload" class="button primary" href="#">下载高清结果</a></main><script>const token=location.pathname.split('/').pop();fetch('/api/shares/'+token).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{shareTitle.textContent=d.original_name;shareMeta.textContent=`${d.width} × ${d.height} · ${d.target_resolution.toUpperCase()} · ${d.model==='anime'?'动漫插画':'通用照片'}`;shareImage.src=d.preview_url;shareDownload.href=d.download_url}).catch(()=>{shareTitle.textContent='分享已失效';shareMeta.textContent='链接已过期、被撤销或结果已删除';shareDownload.hidden=true})</script></body></html>
