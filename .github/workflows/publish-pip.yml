name: PyPI Publish

on: push

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel cython
      - name: Install locked dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          python -m pip install --no-deps 'basicsr>=1.4.2' 'facexlib>=0.2.5' 'gfpgan>=1.3.5'
      - name: Build and install
        run: rm -rf .eggs && python -m pip install --no-deps -e .
      - name: Build for distribution
        run: python setup.py sdist bdist_wheel
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
