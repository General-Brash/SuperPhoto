name: release
on:
  push:
    tags:
      - 'v1.1.0'

jobs:
  release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SuperPhoto v1.1.0" \
            --latest \
            --notes "$(cat <<'EOF'
          ## What's changed

          - Publishes the SuperPhoto v1.1.0 deployment metadata.
          - Uses ghcr.io/general-brash/superphoto:v1.1.0 as the default image for both the API and worker services.
          - Supports IMAGE_REPOSITORY and IMAGE_TAG overrides in Compose.

          ## Deployment

          Docker image publication is intentionally separate from this workflow; push the image to GHCR locally as part of the release procedure.
          EOF
          )"
